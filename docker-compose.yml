version: '3.8'

services:
  fingerprint-api:
    build:
      context: .
    container_name: fingerprint-api-app
    ports:
      # 3017 di host -> 3000 di dalam container
      - "3017:3000"
    env_file:
      - .env
    environment:
      # Dipasang setelah env_file, jadi menimpanya. PORT dikunci supaya
      # pemetaan 3017:3000 tidak rusak kalau .env disunting, dan TZ dikunci
      # karena harus sama dengan setelan jam mesin fingerprint.
      - PORT=3000
      - TZ=Asia/Jakarta
    volumes:
      # Cache per mesin. Tanpa ini setiap restart mengunduh ulang seluruh log
      # dari semua mesin sebelum API siap melayani.
      #
      # Sengaja named volume, BUKAN bind mount ./data. Folder data/ di-gitignore,
      # jadi tidak ada setelah clone. Docker lalu membuatnya sebagai milik root,
      # sedangkan container berjalan sebagai user "node", sehingga cache gagal
      # ditulis tanpa error yang terlihat. Named volume mewarisi kepemilikan
      # dari image, jadi langsung bisa ditulis tanpa langkah manual.
      - fingerprint-data:/app/data
      # Daftar mesin bisa disunting dari host lalu diterapkan dengan
      # POST /api/v1/devices/reload tanpa membangun ulang image.
      - ./devices.json:/app/devices.json:ro
    restart: unless-stopped
    # Menyediakan PID 1 yang benar sehingga sinyal dan proses yatim tertangani.
    init: true
    # Memberi waktu request yang sedang menunggu unduhan untuk selesai sebelum
    # container dipaksa berhenti.
    stop_grace_period: 20s
    networks:
      - fingerprint-internal

volumes:
  fingerprint-data:
    name: fingerprint-data

networks:
  fingerprint-internal:
    name: fingerprint-internal
